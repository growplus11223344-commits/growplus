name: Build signed GrowPlus Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Signed APK - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: growplus_rewards
            artifact: growplus-rewards-android-release
            keystore_secret: REWARDS_KEYSTORE_BASE64
            alias_secret: REWARDS_KEY_ALIAS
            password_secret: REWARDS_KEY_PASSWORD
            store_password_secret: REWARDS_STORE_PASSWORD
          - app: growplus_shopping
            artifact: growplus-shopping-android-release
            keystore_secret: SHOPPING_KEYSTORE_BASE64
            alias_secret: SHOPPING_KEY_ALIAS
            password_secret: SHOPPING_KEY_PASSWORD
            store_password_secret: SHOPPING_STORE_PASSWORD
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Confirm required release configuration
        env:
          API_BASE_URL: ${{ secrets.GROWPLUS_PRODUCTION_API_BASE_URL }}
          SIGNING_KEYSTORE: ${{ secrets[matrix.keystore_secret] }}
          SIGNING_ALIAS: ${{ secrets[matrix.alias_secret] }}
          SIGNING_KEY_PASSWORD: ${{ secrets[matrix.password_secret] }}
          SIGNING_STORE_PASSWORD: ${{ secrets[matrix.store_password_secret] }}
        run: |
          set -euo pipefail
          if [[ -z "$API_BASE_URL" || "$API_BASE_URL" != https://* ]]; then
            echo "::error::Configure GROWPLUS_PRODUCTION_API_BASE_URL with the actual verified backend HTTPS URL."
            exit 1
          fi
          for value in "$SIGNING_KEYSTORE" "$SIGNING_ALIAS" "$SIGNING_KEY_PASSWORD" "$SIGNING_STORE_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "::error::Configure all per-app signing secrets in GitHub Actions."
              exit 1
            fi
          done
          if [[ "$API_BASE_URL" == *"growplus-a1ni.onrender.com"* ]]; then
            echo "::error::Website Render URL is not the separately deployed GrowPlus backend API."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'keyAlias=%s\n' "$SIGNING_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Build production APK
        env:
          API_BASE_URL: ${{ secrets.GROWPLUS_PRODUCTION_API_BASE_URL }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "Release APK exists and its cryptographic signature verifies."

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
