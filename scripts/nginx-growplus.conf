# GrowPlus Ecosystem - Fedora / RHEL Nginx Configuration
# Place in /etc/nginx/conf.d/growplus.conf

server {
    listen 80;
    server_name api.growplus.internal growplus.internal;

    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # 2. Razorpay & Third-Party Webhooks (rawBody preserved)
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 3. Next.js Admin Dashboard
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. GrowPlus Rewards Flutter Web
    location /rewards/ {
        alias /opt/growplus/apps/growplus_rewards/build/web/;
        try_files $uri $uri/ /rewards/index.html;
    }

    # 5. GrowPlus Shopping Flutter Web
    location /shopping/ {
        alias /opt/growplus/apps/growplus_shopping/build/web/;
        try_files $uri $uri/ /shopping/index.html;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
